# Required check for every PR (docs/10 T-62): web lint, typecheck, unit, e2e smoke flows, Python tests.
name: web-ci

on:
  pull_request: {}
  push:
    branches: [main, final]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build && pnpm check:bundle && pnpm check:js   # docs/15: no secrets in .next/static; T-295: landing JS <= 150 kB gzipped
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm i --frozen-lockfile   # e2e/trading-paper builds the extension
        working-directory: apps/extension
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # docs/15 § Secrets and supply chain: secret scan of the full history, and known-vulnerability audits.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repo moves to a GitHub organization; empty (and unused) on a personal account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - run: cd apps/web && pnpm audit --prod --audit-level high
      - run: cd apps/extension && pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt && pip-audit --no-deps --disable-pip -r ops/requirements.lock

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q engine/tests ops/tests
