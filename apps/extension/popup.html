<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kismet</title>
  <link rel="stylesheet" href="./src/ui.css" />
  <style>body { width: 320px; padding: 16px; }</style>
</head>
<body class="stack">
  <header class="row">
    <span class="brand"><img src="/icons/32.png" width="22" height="22" alt="" /><span>Kismet</span></span>
    <span id="tier" class="chip">…</span>
  </header>
  <section class="card stack" aria-label="Status">
    <div class="row"><span class="muted">Account</span><span id="who">Checking…</span></div>
    <div class="row"><span class="muted">Data</span><span id="status">Checking…</span></div>
    <div class="row"><span class="muted">Last scan</span><span id="scan" class="num-tab">—</span></div>
    <div class="row"><span class="muted">Paper trading</span><span id="paper">—</span></div>
  </section>
  <button id="open" class="btn primary">Open Kismet</button>
  <div class="split">
    <button id="signin" class="btn" hidden>Sign in</button>
    <button id="panel" class="btn">Open side panel</button>
  </div>
  <p id="hint" class="small muted" style="margin:0">Open a Polymarket event page to see Kismet next to each market.</p>
  <p class="disclaimer">Market analytics, not financial advice. Based on past results. 18+.</p>
  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
