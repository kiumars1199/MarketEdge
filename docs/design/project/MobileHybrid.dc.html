<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kismet — chosen direction, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070a09}
a{color:#34d399;text-decoration:none}a:hover{color:#6ee7b7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070a09; color: #e6efe9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 20px 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Best bets</div>
<span style="font-size: 12px; color: #a9bab1">Updated 12 min ago</span>
</div>
<p style="margin: 6px 0 12px; font-size: 13px; color: #a9bab1">470 bets priced lower than how often they've won.</p>
<div style="display: flex; gap: 8px; overflow: hidden">
<button style="flex: none; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; background: #0f2a1e; border: 1px solid #1d4a35; color: #d1fae5">My topics</button>
<button style="flex: none; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; background: #0e1411; border: 1px solid #1a2520; color: #c2d1c9">Weather</button>
<button style="flex: none; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; background: #0e1411; border: 1px solid #1a2520; color: #c2d1c9">Soccer</button>
<button style="flex: none; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; background: #0e1411; border: 1px solid #1a2520; color: #c2d1c9">Today</button>
</div>
</div>
<div style="flex: 1; padding: 6px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="border-radius: 16px; background: #0c120f; border: 1px solid #1a2520; padding: 14px; display: flex; gap: 12px; align-items: center">
<div style="flex: 1; min-width: 0">
<div style="font-size: 12px; color: #a9bab1">{{r.tag}} · {{r.closes}}</div>
<div style="font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 3px">{{r.q}}</div>
<div style="font-size: 12px; color: #a9bab1; margin-top: 4px">Bet {{r.side}} at {{r.ask}} · won {{r.win}} before</div>
</div>
<div style="text-align: right; flex: none">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: {{accent}}">{{r.ret}}</div>
<div style="font-size: 11px; color: #a9bab1">expected</div>
</div>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #1a2520; background: #0a0f0d; padding: 8px 0 14px; font-size: 11px; text-align: center">
<a href="#" style="color: {{accent}}; padding: 10px 0">Best bets</a>
<a href="#" style="color: #a9bab1; padding: 10px 0">All markets</a>
<a href="#" style="color: #a9bab1; padding: 10px 0">My list</a>
<a href="#" style="color: #a9bab1; padding: 10px 0">More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#10b981","options":["#10b981","#22c55e","#34d399"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#10b981',
      rows: [
        { tag: 'Soccer', closes: '19h', q: 'Denmark vs. Norway: Both Teams to Score', side: 'Yes', ask: '68¢', win: '92%', ret: '+33%' },
        { tag: 'Soccer', closes: '10h', q: 'Singapore vs. Brazil: Both Teams to Score', side: 'No', ask: '71¢', win: '92%', ret: '+28%' },
        { tag: 'Weather', closes: '36h', q: 'Highest temperature in Dallas: 70–71°F', side: 'No', ask: '70¢', win: '86%', ret: '+22%' },
        { tag: 'NFL', closes: '3 days', q: 'Colts vs. Texans', side: 'Texans', ask: '85¢', win: '99%', ret: '+15%' },
        { tag: 'Weather', closes: '36h', q: 'Highest temperature in Wellington: 18°C', side: 'No', ask: '71¢', win: '85%', ret: '+19%' }
      ]
    };
  }
}
</script>
</body>
</html>
